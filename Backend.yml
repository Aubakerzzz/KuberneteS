apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stock-backend
  template:
    metadata:
      labels:
        app: stock-backend
    spec:
      containers:
        - name: stock-backend
          image: stock-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: stock-db-service
            - name: DB_USER
              value: stockuser
            - name: DB_PASSWORD
              value: stockpass
            - name: DB_NAME
              value: stocks
---
apiVersion: v1
kind: Service
metadata:
  name: stock-backend-service
spec:
  type: ClusterIP
  selector:
    app: stock-backend
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30001
