apiVersion: apps/v1
kind: Deployment
metadata:
  name: stock-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stock-frontend
  template:
    metadata:
      labels:
        app: stock-frontend
    spec:
      containers:
        - name: stock-frontend
          image: stock-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://stock-backend-service:5000
---
apiVersion: v1
kind: Service
metadata:
  name: stock-frontend-service
spec:
  type: ClusterIP
  selector:
    app: stock-frontend
  ports:
    - port: 80
      targetPort: 80
