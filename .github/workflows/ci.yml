name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # Checkout code
      # -----------------------
      - name: Checkout repository
        uses: actions/checkout@v3

      # -----------------------
      # Set up Docker
      # -----------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # -----------------------
      # Build services
      # -----------------------
      - name: Build Docker Compose services
        run: docker compose build

      # -----------------------
      # Start services
      # -----------------------
      - name: Start services
        run: docker compose up -d

      # -----------------------
      # Wait for DB to initialize
      # -----------------------
      - name: Wait for DB initialization
        run: |
          echo "⏳ Waiting for MySQL (init.sql) ..."
          sleep 25
          docker compose ps

      # -----------------------
      # Run backend tests
      # -----------------------
      - name: Run backend tests
        run: docker compose run --rm backend pytest -v --maxfail=1 --disable-warnings

      # -----------------------
      # Shut down services
      # -----------------------
      - name: Stop services
        if: always()
        run: docker compose down -v
        