apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-ingress
spec:
  rules:
    - host: stock.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: stock-backend-service
                port:
                  number: 5000
